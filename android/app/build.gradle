plugins { id 'com.android.application' }

android {
    namespace 'mx.csiztapalapa.almacen'
    compileSdk 34

    defaultConfig {
        applicationId 'mx.csiztapalapa.almacen'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Se firma con la llave de depuración para poder instalarlo
            // directamente sin trámites de Play Store.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies { }
