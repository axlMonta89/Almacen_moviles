# Construye el APK de Android en la nube, gratis, sin instalar nada.
# Cómo usarlo: sube esta carpeta a un repositorio de GitHub.  Cada vez
# que subas cambios, aquí mismo (pestaña "Actions") podrás descargar el
# APK ya armado.  También se puede lanzar a mano con "Run workflow".
name: Construir APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar el SDK de Android
        uses: android-actions/setup-android@v3

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar el APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Publicar el APK
        uses: actions/upload-artifact@v4
        with:
          name: CS-Almacen-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
